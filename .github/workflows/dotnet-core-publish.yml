name: .NET Core

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:      
      - name : Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Install dependencies
        run: dotnet restore
      - name: Read project version
        id: version
        run: echo "version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"slucky31_mycomicsmanager"
          /o:"slucky31-1"
          /v:"${{ steps.version.outputs.version }}"
          /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml"
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Tests
        run: dotnet test --configuration Release --no-build --no-restore --results-directory "test-results" --collect:"XPlat Code Coverage"
        env:
          ConnectionStrings__NeonConnectionUnitTests: ${{ secrets.CONNECTIONSTRINGS_NEONCONNECTIONUNITTESTS }}
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end

  publish:
    needs: build
    if: ${{ (github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.versionize.outputs.released }}
    steps:
      # actions/checkout persists the given token's credentials (as an http.extraheader) for
      # every git command in this job. If left at the default GITHUB_TOKEN, that persisted
      # header takes precedence over the different token ad-m/github-push-action embeds in
      # its remote URL later, so the push still authenticates as GITHUB_TOKEN/github-actions[bot]
      # - which branch protection does not exempt - regardless of what RELEASE_TOKEN is set to.
      -
        name : Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup git
        run: |
          git config --global user.email "nicolas.dufaut@gmail.com"
          git config --global user.name "slucky31"

      - name: Install Versionize
        run: dotnet tool install --global Versionize

      - name: Versioning
        id: versionize
        run: |
          set +e
          versionize --exit-insignificant-commits
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "No significant commit since the last release, skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # The default GITHUB_TOKEN can't push to main: required status checks only run on
      # PRs, never on a direct push, so branch protection rejects it. RELEASE_TOKEN is a
      # PAT from an admin account, exempted via enforce_admins=false.
      - name: Push changes to GitHub
        if: steps.versionize.outputs.released == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          branch: ${{ github.ref }}
          tags: true
          force: true

      - name: "Create release"
        if: steps.versionize.outputs.released == 'true'
        uses: "actions/github-script@v9"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            try {
              const tags_url = context.payload.repository.tags_url + "?per_page=1"
              const result = await github.request(tags_url)
              const current_tag = result.data[0].name
              await github.rest.repos.createRelease({
                draft: false,
                generate_release_notes: true,
                name: current_tag,
                owner: context.repo.owner,
                prerelease: false,
                repo: context.repo.repo,
                tag_name: current_tag,
              });
            } catch (error) {
              core.setFailed(error.message);
            }

  docker-web:
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name : Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/slucky31/mcm
      - name: Build and push Docker image MyComicsManagerWeb
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          file: ./Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
