name: CD

on:
  push:
    branches: [ main ]

# One CD run at a time on main. Two overlapping runs would each compute the same next version
# and push their own release commit, and the first push could drop a merge that landed meanwhile.
# A queued run is not cancelled by the one in progress; if a third merge arrives, it replaces
# the queued one, whose commits it contains anyway (Versionize releases everything since the
# last tag). Release commits only re-trigger this workflow to be skipped (see build.if): they
# get a group of their own so they never take the place of a queued merge.
concurrency:
  group: ${{ startsWith(github.event.head_commit.message, 'chore(release):') && format('cd-release-commit-{0}', github.sha) || 'cd-main' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Analyze
    # The release job pushes a "chore(release): x.y.z" commit with RELEASE_TOKEN (a PAT), which
    # re-triggers this workflow. That commit only bumps version files and the changelog, was
    # already built and analyzed by the run that produced it, and can never release again:
    # skip it, which also skips the jobs that depend on build.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    # Integration tests run against a throwaway PostgreSQL on the runner itself: the
    # self-hosted server is too far from GitHub's runners, and its round-trip latency
    # made Persistence.Tests take ~2.5 min instead of ~10 s. Keep the major version in
    # line with production (PostgreSQL 18).
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database reachable only from this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mcm_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name : Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Install Versionize
        run: dotnet tool install --global Versionize
      - name: Install dependencies
        run: dotnet restore
      - name: Compute next version
        id: version
        run: |
          set +e
          output=$(versionize --dry-run --exit-insignificant-commits 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$(echo "$output" | grep -oP 'bumping version from \S+ to \K\S+')" >> "$GITHUB_OUTPUT"
          else
            echo "No significant commit since the last release, skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"
          fi
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"slucky31_mycomicsmanager"
          /o:"slucky31-1"
          /v:"${{ steps.version.outputs.version }}"
          /d:sonar.cs.cobertura.reportsPaths="**/*.cobertura.xml"
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Tests
        run: dotnet test --configuration Release --no-build --no-restore --results-directory "test-results" --coverage --coverage-output-format cobertura
        env:
          ConnectionStrings__NeonConnectionUnitTests: Host=localhost;Port=5432;Database=mcm_tests;Username=postgres
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end

  release:
    name: Release
    needs: build
    if: ${{ (github.ref == 'refs/heads/main') && needs.build.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.main-head.outputs.current }}
      sha: ${{ steps.release-commit.outputs.sha }}
    steps:
      # actions/checkout persists the given token's credentials (as an http.extraheader) for
      # every git command in this job. If left at the default GITHUB_TOKEN, that persisted
      # header takes precedence over the different token ad-m/github-push-action embeds in
      # its remote URL later, so the push still authenticates as GITHUB_TOKEN/github-actions[bot]
      # - which branch protection does not exempt - regardless of what RELEASE_TOKEN is set to.
      -
        name : Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # A merge that landed on main after this run started is not in this release commit:
      # pushing it would be rejected (or, forced, would drop that merge). Leave the release to
      # the run of that merge, queued behind this one, which releases every commit since the
      # last tag.
      - name: Check main is still at this run's commit
        id: main-head
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past $GITHUB_SHA: the next CD run releases these commits."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup git
        if: steps.main-head.outputs.current == 'true'
        run: |
          git config --global user.email "nicolas.dufaut@gmail.com"
          git config --global user.name "slucky31"

      - name: Install Versionize
        if: steps.main-head.outputs.current == 'true'
        run: dotnet tool install --global Versionize

      # Pin the exact version the build job already analyzed and reported to SonarCloud,
      # instead of recomputing it here - keeps the two in sync and avoids a second scan
      # of commit history landing on a different result.
      - name: Versioning
        if: steps.main-head.outputs.current == 'true'
        run: versionize --release-as "${{ needs.build.outputs.version }}"

      # The default GITHUB_TOKEN can't push to main: required status checks only run on
      # PRs, never on a direct push, so branch protection rejects it. RELEASE_TOKEN is a
      # PAT from an admin account, exempted via enforce_admins=false.
      # Never forced: if main still moved in the meantime, the push fails instead of dropping
      # that merge, and the next run releases it.
      - name: Push changes to GitHub
        if: steps.main-head.outputs.current == 'true'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

      - name: Record the release commit
        id: release-commit
        if: steps.main-head.outputs.current == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  docker-web:
    name: Publish Docker
    needs: [build, release]
    if: needs.build.outputs.released == 'true' && needs.release.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Without an explicit ref, checkout resolves the SHA that triggered this workflow run,
      # i.e. the commit *before* the release job's Versionize push. Pinning to the release
      # commit picks up that bump, so the image is built with the version it's tagged with
      # (and not with a later merge that main may already hold).
      - name : Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/slucky31/mcm
          # No tag event on a push to main to derive a version from, hence the value taken
          # from the build job's Versionize result. Deployments track "latest".
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.version }}
            type=raw,value=latest
      - name: Build and push Docker image MyComicsManagerWeb
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          file: ./Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [release, docker-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Create release"
        uses: "actions/github-script@v9"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            try {
              const tags_url = context.payload.repository.tags_url + "?per_page=1"
              const result = await github.request(tags_url)
              const current_tag = result.data[0].name
              await github.rest.repos.createRelease({
                draft: false,
                generate_release_notes: true,
                name: current_tag,
                owner: context.repo.owner,
                prerelease: false,
                repo: context.repo.repo,
                tag_name: current_tag,
              });
            } catch (error) {
              core.setFailed(error.message);
            }
