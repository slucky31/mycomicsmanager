name: CI

on:
  pull_request:
    branches: [ main ]

# A new push to a PR makes the run in progress for its previous commit useless: cancel it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Integration tests run against a throwaway PostgreSQL on the runner itself: the
      # self-hosted server is too far from GitHub's runners, and its round-trip latency
      # made Persistence.Tests take ~2.5 min instead of ~10 s. Keep the major version in
      # line with production (PostgreSQL 19).
      # Started in the background rather than as a job service, which held the first step
      # for ~15-20 s: the image pull and the start-up now overlap the restore and the build.
      # Throwaway database reachable only from this job: no password needed.
      - name: Start PostgreSQL
        run: >
          nohup docker run --rm --name postgres -p 5432:5432
          -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=mcm_tests
          postgres:19 > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - name : Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of SonarCloud analysis

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          # Temurin is in the runner's tool cache for every LTS version: nothing to download.
          distribution: 'temurin'
          java-version: '25'

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Install dependencies
        run: dotnet restore
      - name: Read project version
        id: version
        run: echo "version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"
      # Same build as `dotnet build -c Release -warnaserror` in local: any warning fails the build.
      # It runs before the SonarScanner, whose analysis build forces TreatWarningsAsErrors=false
      # and adds the rules of the SonarCloud quality profile, left to its quality gate.
      - name: Build (warnings as errors)
        run: dotnet build --configuration Release --no-restore -warnaserror
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"slucky31_mycomicsmanager"
          /o:"slucky31-1"
          /v:"${{ steps.version.outputs.version }}"
          /d:sonar.cs.cobertura.reportsPaths="**/*.cobertura.xml"
          /d:sonar.coverage.exclusions="**/wwwroot/js/**"
      - name: Build
        run: dotnet build --configuration Release --no-restore --no-incremental
      # Checked over TCP: while initializing, the image runs a temporary server on the Unix
      # socket only, which reports ready before the restart. The log shows why on a timeout.
      - name: Wait for PostgreSQL
        run: |
          timeout 120 bash -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -q 2>/dev/null; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/postgres.log"; exit 1; }
      - name: Tests
        run: dotnet test --configuration Release --no-build --no-restore --results-directory "test-results" --coverage --coverage-output-format cobertura
        env:
          ConnectionStrings__NeonConnectionUnitTests: Host=localhost;Port=5432;Database=mcm_tests;Username=postgres
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end
      # Same rule as SonarCloud, on this runner: at least 80 % of the changed lines are covered,
      # UI code (Razor components and their code-behind) excepted, as CLAUDE.md says. After the
      # SonarCloud analysis, so that a failure here still leaves its report.
      - name: Coverage of the changed lines
        run: |
          mapfile -t reports < <(find test-results tests -name '*.cobertura.xml' -not -path '*/obj/*' 2>/dev/null | sort -u)
          pipx run --spec diff-cover==11.0.0 diff-cover "${reports[@]}" \
            --compare-branch=origin/main --fail-under=80 \
            --exclude '*.razor' '*.razor.cs' \
            --format "markdown:$RUNNER_TEMP/diff-cover.md"
      - name: Publish the coverage of the changed lines
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/diff-cover.md" ]; then cat "$RUNNER_TEMP/diff-cover.md" >> "$GITHUB_STEP_SUMMARY"; fi

  # Runs alongside the build job instead of after it: it only checks that the image still
  # builds and pushes no image (hence no registry login).
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Betterleaks (MIT, successor of Gitleaks by the same author), called as a CLI from a
      # pinned release: gitleaks-action is under a proprietary EULA since its v2.
      BETTERLEAKS_VERSION: 1.10.1
      BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The scan reads every commit of the PR
      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto "=https" --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" betterleaks
      # Only the commits of the PR; known false positives go in .betterleaksignore.
      - name: Scan the PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          "$RUNNER_TEMP/betterleaks" git .
          --log-opts="$BASE_SHA..$HEAD_SHA"
          --redact=100 --verbose --no-banner --no-color

  docker-web:
    name: Docker Build
    # The image targets linux/arm64: a native arm64 runner builds it without QEMU emulation.
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      security-events: write # Upload of the Trivy SARIF to the Security tab
    steps:
      - name : Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Docker image MyComicsManagerWeb
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Loaded into the runner's Docker for the Trivy scan; nothing is pushed.
          load: true
          tags: mycomicsmanager-web:ci
          context: .
          platforms: linux/arm64
          file: ./Web/Dockerfile
          cache-from: type=gha
          # Only the final image's layers (the apk add one is worth keeping): the build stage
          # changes with every commit, and its NuGet packages restore faster than they download
          # back from the cache.
          cache-to: type=gha,mode=min
      # Pinned by commit SHA, never by tag: tags of this action were hijacked in a 2026
      # supply-chain incident. The Trivy version is pinned too.
      # Unfixed CVEs are left out: no update could clear them, they would block every PR.
      # First the SARIF report for the Security tab, then the same scan as a table in the log,
      # which is the step that fails the job.
      - name: Scan the image for vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: mycomicsmanager-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
      - name: Upload the Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Fail on a fixable HIGH or CRITICAL vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: mycomicsmanager-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
