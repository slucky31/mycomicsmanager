name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    # Integration tests run against a throwaway PostgreSQL on the runner itself: the
    # self-hosted server is too far from GitHub's runners, and its round-trip latency
    # made Persistence.Tests take ~2.5 min instead of ~10 s. Keep the major version in
    # line with production (PostgreSQL 18).
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database reachable only from this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mcm_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name : Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of SonarCloud analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Install dependencies
        run: dotnet restore
      - name: Read project version
        id: version
        run: echo "version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"slucky31_mycomicsmanager"
          /o:"slucky31-1"
          /v:"${{ steps.version.outputs.version }}"
          /d:sonar.cs.cobertura.reportsPaths="**/*.cobertura.xml"
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Tests
        run: dotnet test --configuration Release --no-build --no-restore --results-directory "test-results" --coverage --coverage-output-format cobertura
        env:
          ConnectionStrings__NeonConnectionUnitTests: Host=localhost;Port=5432;Database=mcm_tests;Username=postgres
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end

  docker-web:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name : Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image MyComicsManagerWeb
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          outputs: type=cacheonly
          context: .
          platforms: linux/arm64
          file: ./Web/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
