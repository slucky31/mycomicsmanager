name: Pull Request Labeling

on:
  - pull_request

jobs:
  labeler:
    permissions:
        contents: read
        pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7

  size-labeler:
    permissions:
        contents: read
        pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff # v0.5.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          sizes: >
            {
                "0": "XS",
                "20": "S",
                "50": "M",
                "200": "L",
                "800": "XL",
                "2000": "XXL"
            }